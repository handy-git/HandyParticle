  material: ENDER_PEARL
  isEnchant: false
  sound: ""
  name: "    &8[&c关闭本类&8]"
  lore:
    - '&8▪ &7关闭 &a${category} &7类粒子效果'
  custom-model-data: 0

# 自定义按钮

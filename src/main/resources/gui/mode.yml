# 模式菜单配置
title: "&0粒子选择 &8▪ &7${category}"
size: 54
sound: ""

# 模式选项槽位
list:
  # 10 个拖尾运动模式
  index: 19,20,21,22,23,24,25,28,29,30,31,32,33,34
  # 每项可按按钮格式继续设置 name、lore、isEnchant、sound、custom-model-data
  items:
    DEFAULT:
      material: COMPASS
    CIRCLE:
      material: CLOCK
    MAGICIAN:
      material: AMETHYST_SHARD
    PULSE:
      material: HEART_OF_THE_SEA
    HELIX:
      material: END_ROD
    DNA:
      material: IRON_CHAIN
    SPIRAL:
      material: NAUTILUS_SHELL
    FOOT_CIRCLE:
      material: CLOCK
    COLOR_SPIN:
      material: FIREWORK_STAR
    FAIRY:
      material: GLOW_BERRIES

# 数据区物品的公共部分
data:
  enable: true
  sound: ""
  isEnchant: false
  custom-model-data: 0
  hideFlag: true
  # 物品名称 ${name} 效果描述 ${desc}
  name: "    &8[&a${name}&8]"
  lore:
    - '&8▪ &7效果: &a${desc}'
    - ''
    - '&8[&c✔&8] &7左键选择'

# 数据区已选中物品的展示部分 覆盖 data
selected:
  enable: true
  sound: ""
  isEnchant: true
  custom-model-data: 0
  hideFlag: true
  name: "    &8[&e${name}&8]"
  lore:
    - '&8▪ &7效果: &a${desc}'
    - ''
    - '&8[&a✔&8] &7当前已选中'

# 返回上一级
back:
  enable: true
  index: 49
  name: "   &8[&a返回&8]"
  material: PLAYER_HEAD
  headBase: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjllYTFkODYyNDdmNGFmMzUxZWQxODY2YmNhNmEzMDQwYTA2YzY4MTc3Yzc4ZTQyMzE2YTEwOThlNjBmYjdkMyJ9fX0="
  isEnchant: false
  lore:
    - '&f- &7点击返回'

# 抛射物生效范围菜单配置
title: "&0抛射物选择 &8▪ &7生效范围"
size: 54
sound: ""

# 抛射物选项槽位
list:
  # 13 个抛射物类型 单行排布 第3行
  index: 19,20,21,22,23,24,25,28,29,30,31,32,33
  # 每项可单独覆盖 material
  items:
    ARROW:
      material: ARROW
    SPECTRAL_ARROW:
      material: SPECTRAL_ARROW
    TRIDENT:
      material: TRIDENT
    SNOWBALL:
      material: SNOWBALL
    EGG:
      material: EGG
    FIREBALL:
      material: BLAZE_POWDER
    FIREWORK_ROCKET:
      material: FIREWORK_ROCKET
    SPLASH_POTION:
      material: SPLASH_POTION
    LINGERING_POTION:
      material: LINGERING_POTION
    EXPERIENCE_BOTTLE:
      material: EXPERIENCE_BOTTLE
    ENDER_PEARL:
      material: ENDER_PEARL
    SHULKER_BULLET:
      material: SHULKER_SHELL
    WIND_CHARGE:
      material: WIND_CHARGE

# 未勾选的抛射物
data:
  enable: true
  material: PAPER
  sound: ""
  isEnchant: false
  custom-model-data: 0
  hideFlag: true
  # ${name} 抛射物名称
  name: "    &8[&7${name}&8]"
  lore:
    - '&8▪ &7类型: &a${name}'
    - ''
    - '&8[&c✔&8] &7左键勾选'

# 已勾选的抛射物
selected:
  enable: true
  material: LIME_STAINED_GLASS_PANE
  sound: ""
  isEnchant: true
  custom-model-data: 0
  hideFlag: true
  name: "    &8[&a${name}&8]"
  lore:
    - '&8▪ &7类型: &a${name}'
    - ''
    - '&8[&a✔&8] &7当前生效，点击取消'

# 返回上一级
back:
  enable: true
  # 底部第6行中间格
  index: 49
  name: "   &8[&a返回&8]"
  material: PLAYER_HEAD
  headBase: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjllYTFkODYyNDdmNGFmMzUxZWQxODY2YmNhNmEzMDQwYTA2YzY4MTc3Yzc4ZTQyMzE2YTEwOThlNjBmYjdkMyJ9fX0="
  isEnchant: false
  lore:
    - '&f- &7点击返回'
  custom-model-data: 0

# 全选
selectAll:
  enable: true
  # 顶部第1行左侧空位
  index: 2
  material: LIME_DYE
  isEnchant: false
  sound: ""
  name: "    &8[&a全选&8]"
  lore:
    - '&8▪ &7当前已选 &a${selected} &7/ &a${number} &7种'
    - '&8▪ &7点击勾选全部抛射物'
  custom-model-data: 0

# 全不选
clearAll:
  enable: true
  # 顶部第1行右侧空位
  index: 6
  material: GRAY_DYE
  isEnchant: false
  sound: ""
  name: "    &8[&c全不选&8]"
  lore:
    - '&8▪ &7当前已选 &a${selected} &7/ &a${number} &7种'
    - '&8▪ &7点击取消全部勾选'
  custom-model-data: 0

# 自定义按钮
custom:
  # 分割板
  pane:
    enable: true
    # 分割板覆盖除数据区与按钮外的全部槽位
    # 让出：19-25、28-33（抛射物选项） 2（全选） 6（全不选） 49（返回）
    index: 0,1,3,4,5,7,8,9,17,18,26,27,35,36,44,45,46,47,48,50,51,52,53
    material: BLACK_STAINED_GLASS_PANE
    isEnchant: false
    sound: ""
    name: "        &8[&7分割板&8]"
    lore:
      - "&7哎呀,不要随便戳人家啦"
    custom-model-data: 0

# 武器生效范围菜单配置
title: "&0武器选择 &8▪ &7生效范围"
size: 54
sound: ""

# 武器分组选项槽位
list:
  # 9 个武器分组 单行排布 第3行
  index: 19,20,21,22,23,24,25,28,29
  # 每项可单独覆盖 material，图标统一用钻石级武器
  items:
    SWORD:
      material: DIAMOND_SWORD
    AXE:
      material: DIAMOND_AXE
    PICKAXE:
      material: DIAMOND_PICKAXE
    SHOVEL:
      material: DIAMOND_SHOVEL
    HOE:
      material: DIAMOND_HOE
    TRIDENT:
      material: TRIDENT
    MACE:
      material: MACE
    SPEAR:
      material: DIAMOND_SPEAR
    HAND:
      material: PLAYER_HEAD

# 未勾选的武器分组
data:
  enable: true
  material: PAPER
  sound: ""
  isEnchant: false
  custom-model-data: 0
  hideFlag: true
  # ${name} 武器分组名称
  name: "    &8[&7${name}&8]"
  lore:
    - '&8▪ &7类型: &a${name}'
    - ''
    - '&8[&c✔&8] &7左键勾选'

# 已勾选的武器分组
selected:
  enable: true
  material: LIME_STAINED_GLASS_PANE
  sound: ""
  isEnchant: true
  custom-model-data: 0
  hideFlag: true
  name: "    &8[&a${name}&8]"
  lore:
    - '&8▪ &7类型: &a${name}'
    - ''
    - '&8[&a✔&8] &7当前生效，点击取消'

# 返回上一级
back:
  enable: true
  # 底部第6行中间格
  index: 49
  name: "   &8[&a返回&8]"
  material: PLAYER_HEAD
  headBase: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjllYTFkODYyNDdmNGFmMzUxZWQxODY2YmNhNmEzMDQwYTA2YzY4MTc3Yzc4ZTQyMzE2YTEwOThlNjBmYjdkMyJ9fX0="
  isEnchant: false
  lore:
    - '&f- &7点击返回'
  custom-model-data: 0

# 全选
selectAll:
  enable: true
  # 顶部第1行左侧空位
  index: 2
  material: LIME_DYE
  isEnchant: false
  sound: ""
  name: "    &8[&a全选&8]"
  lore:
    - '&8▪ &7当前已选 &a${selected} &7/ &a${number} &7种'
    - '&8▪ &7点击勾选全部武器'
  custom-model-data: 0

# 全不选
clearAll:
  enable: true
  # 顶部第1行右侧空位
  index: 6
  material: GRAY_DYE
  isEnchant: false
  sound: ""
  name: "    &8[&c全不选&8]"
  lore:
    - '&8▪ &7当前已选 &a${selected} &7/ &a${number} &7种'
    - '&8▪ &7点击取消全部勾选'
  custom-model-data: 0

# 自定义按钮
custom:
  # 分割板
  pane:
    enable: true
    # 分割板只铺外围边框，与抛射物页保持一致
    # 让出：19-25、28-29（武器分组） 2（全选） 6（全不选） 49（返回）
    index: 0,1,3,4,5,7,8,9,17,18,26,27,35,36,44,45,46,47,48,50,51,52,53
    material: BLACK_STAINED_GLASS_PANE
    isEnchant: false
    sound: ""
    name: "        &8[&7分割板&8]"
    lore:
      - "&7哎呀,不要随便戳人家啦"
    custom-model-data: 0

# 类别菜单配置
title: "&0粒子选择 &8▪ &7${category}"
size: 54
sound: ""

# 类别选项槽位
list:
  # 8 个粒子类别的按钮槽位
  # 排布为 第3行 19-25（7个） 第4行 28（1个）
  index: 19,20,21,22,23,24,25,28
  # 每项可按按钮格式继续设置 name、lore、isEnchant、sound、custom-model-data
  items:
    TRAIL:
      material: BLAZE_POWDER
    WING:
      material: FEATHER
    BLOCK:
      material: GRASS_BLOCK
    RAIN:
      material: CHEST
    CONFETTI:
      material: FIREWORK_ROCKET
    ELYTRA:
      material: ELYTRA
    PROJECTILE:
      material: TARGET
    WEAPON:
      material: DIAMOND_SWORD

# 数据区物品的公共部分
data:
  enable: true
  sound: ""
  isEnchant: false
  custom-model-data: 0
  hideFlag: true
  # 物品名称 ${name} 效果描述 ${desc}
  name: "    &8[&a${name}&8]"
  lore:
    - '&8▪ &7类别: &a${desc}'
    - ''
    - '&8[&c✔&8] &7左键选择'

# 数据区已选中物品的展示部分 覆盖 data
selected:
  enable: true
  sound: ""
  isEnchant: true
  custom-model-data: 0
  hideFlag: true
  name: "    &8[&e${name}&8]"
  lore:
    - '&8[&a✔&8] &a当前已选中'
    - ''
    - '&8▪ &7具体效果: &f${desc}'
    - ''
    - '&8▪ &7左键点击更换'
    - '&8▪ &7右键取消该类粒子'

# 返回按钮
back:
  enable: true
  index: 49
  name: "   &8[&a返回&8]"
  material: PLAYER_HEAD
  headBase: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjllYTFkODYyNDdmNGFmMzUxZWQxODY2YmNhNmEzMDQwYTA2YzY4MTc3Yzc4ZTQyMzE2YTEwOThlNjBmYjdkMyJ9fX0="
  isEnchant: false
  lore:
    - '&f- &7点击返回'
  custom-model-data: 0

# 关闭全部粒子
closeAll:
  enable: true
  index: 4
  material: ENDER_PEARL
  isEnchant: false
  sound: ""
  name: "    &8[&c关闭全部&8]"
  lore:
    - '&8▪ &7关闭全部粒子效果并清空记录'
  custom-model-data: 0

# 自定义按钮
custom:
  # 分割板
  pane:
    enable: true
    index: 0,1,2,3,5,6,7,8,9,17,18,26,27,35,36,44,45,46,47,48,50,51,52,53
    material: BLACK_STAINED_GLASS_PANE
    isEnchant: false
    sound: ""
    name: "        &8[&7分割板&8]"
    lore:
      - "&7哎呀,不要随便戳人家啦"
    custom-model-data: 0


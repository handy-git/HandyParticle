name: HandyParticle
main: cn.handyplus.particle.HandyParticle
version: 1.0.1
author: handy
api-version: 1.13
description: 一个有点好用的玩家粒子插件
website: https://ricedoc.handyplus.cn/wiki/HandyParticle/log/
softdepend: [ AuthMe, CatSeedLogin, OauthLogin ]
folia-supported: true
commands:
  handyParticle:
    description: 玩家粒子插件
    aliases: [ hp ]
permissions:
  handyParticle.*:
    description: 玩家粒子插件
    children:
      handyParticle.reload: true
      handyParticle.convert: true
      handyParticle.gui: true
      handyParticle.player: true
      handyParticle.entity: true
  handyParticle.reload:
    description: 重载配置
    default: op
  handyParticle.convert:
    description: 转化数据库
    default: op
  handyParticle.gui:
    description: 打开粒子选择gui
    default: op
  handyParticle.player:
    description: 管理玩家粒子效果
    default: op
  handyParticle.entity:
    description: 管理实体粒子效果
    default: op
  handyParticle.particle.*:
    description: 使用全部玩家粒子效果
    default: op
  handyParticle.particle.trail.*:
    description: 使用全部拖尾粒子效果
    default: false
  handyParticle.particle.wing.*:
    description: 使用全部翅膀粒子效果
    default: false
  handyParticle.particle.block.*:
    description: 使用全部方块粒子效果
    default: false
  handyParticle.particle.rain.*:
    description: 使用全部物品雨粒子效果
    default: false
  handyParticle.particle.confetti.*:
    description: 使用全部纸屑粒子效果
    default: false
  handyParticle.particle.elytra.*:
    description: 使用全部鞘翅粒子效果
    default: false
  handyParticle.particle.projectile.*:
    description: 使用全部抛射物粒子效果
    default: false
  handyParticle.particle.weapon.*:
    description: 使用全部武器粒子效果
    default: false
